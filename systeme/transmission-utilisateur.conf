# Transmission tourne sous le compte « medias » (sans droits), groupe jellyfin : Radarr, Sonarr et Jellyfin partagent les fichiers.
[Service]
Type=simple
User=medias
Group=jellyfin
UMask=0002
ExecStart=
ExecStart=/usr/bin/transmission-daemon -f --log-level=error --config-dir /var/lib/medias/transmission

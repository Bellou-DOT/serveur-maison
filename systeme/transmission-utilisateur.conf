# Transmission tourne sous le compte du serveur, groupe jellyfin : Radarr, Sonarr et Jellyfin partagent les fichiers.
[Service]
Type=simple
User=@UTILISATEUR@
Group=jellyfin
UMask=0002
ExecStart=
ExecStart=/usr/bin/transmission-daemon -f --log-level=error --config-dir @ACCUEIL@/.config/transmission-daemon
